<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jadwal Shift Kerja</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
  background: linear-gradient(135deg, #0f172a, #1e293b, #334155);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
  color: #fff;
}

.card {
  width: 100%;
  max-width: 420px;
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(15px);
  border-radius: 20px;
  padding: 30px;
  text-align: center;
  box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
}

h1 {
  font-size: 28px;
  margin-bottom: 5px;
}

.watermark {
  margin-bottom: 22px;
  font-size: 12px;
  color: #94a3b8;
  letter-spacing: 1px;
  opacity: 0.75;
}

#tanggal {
  font-size: 18px;
  color: #cbd5e1;
  margin-bottom: 10px;
}

#jam {
  font-size: 32px;
  font-weight: bold;
  margin-bottom: 15px;
}

#status {
  font-size: 26px;
  font-weight: bold;
  margin-bottom: 15px;
}

.badge {
  display: inline-block;
  padding: 10px 20px;
  border-radius: 999px;
  font-weight: bold;
  margin-bottom: 15px;
}

.kerja { background: #16a34a; }
.libur { background: #2563eb; }
.istirahat { background: #6b7280; }
.off { background: #000000; }
.persiapan { 
  background: #eab308; 
  color: #000000; 
}

#countdown {
  font-size: 20px;
  font-weight: bold;
  margin-top: 10px;
}

#keterangan {
  font-size: 15px;
  margin-top: 8px;
}

#next {
  line-height: 1.7;
  color: #e2e8f0;
}

.footer {
  margin-top: 25px;
  font-size: 13px;
  color: #94a3b8;
}

#tombolMusik {
  margin-top: 15px;
  padding: 10px 18px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-weight: bold;
  background: #fff;
  color: #111827;
  transition: transform 0.2s;
}

#tombolMusik:hover {
  transform: scale(1.05);
}

@media(max-width:500px){
  h1 { font-size: 24px; }
  #status { font-size: 22px; }
}
</style>

</head>
<body>

<audio id="musikKerja" loop>
  <source src="Berdansa lahh.mp3" type="audio/mpeg">
</audio>

<audio id="musikLibur" loop>
  <source src="ngana so pigi.mp3" type="audio/mpeg">
</audio>

<div class="card">
  <h1>📅 Jadwal Shift</h1>
  <div class="watermark">Created by Hapid</div>

  <div id="tanggal"></div>
  <div id="jam"></div>

  <div id="status"></div>
  <div class="badge" id="badge"></div>

  <div id="keterangan"></div>
  <div id="countdown"></div>

  <div id="next"></div>

  <button id="tombolMusik" onclick="putarMusik()">
    🎵 Putar Musik
  </button>

  <div class="footer">
    Update otomatis setiap hari
  </div>
</div>

<script>
const baseDate = new Date(2026, 7, 7); // 7 Agustus 2026
const baseIndex = 1;

const shift = [
  "Kerja Pagi ke-1",
  "Kerja Pagi ke-2",
  "Kerja Pagi ke-3",
  "Kerja Pagi ke-4",
  "Libur ke-1",
  "Libur ke-2"
];

const hari = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
const bulan = [
  "Januari", "Februari", "Maret", "April", "Mei", "Juni",
  "Juli", "Agustus", "September", "Oktober", "November", "Desember"
];

const today = new Date();
today.setHours(0,0,0,0);
baseDate.setHours(0,0,0,0);

const diff = Math.floor((today - baseDate) / (1000 * 60 * 60 * 24));
const index = ((baseIndex + diff) % shift.length + shift.length) % shift.length;
const status = shift[index];

document.getElementById("tanggal").innerHTML =
  `${hari[today.getDay()]}, ${today.getDate()} ${bulan[today.getMonth()]} ${today.getFullYear()}`;

document.getElementById("status").innerHTML = status;

const badge = document.getElementById("badge");

const besok = (index + 1) % shift.length;

document.getElementById("next").innerHTML = `
<hr style="margin:20px 0;border:0;border-top:1px solid rgba(255,255,255,.15);">

Hari ini kamu menjalani:<br>
<b style="font-size:20px;">${status}</b>

<br><br>

Besok:<br>
<b>${shift[besok]}</b>

<br><br>

Siklus Kerja:<br>
<small>Kerja Pagi 1 → Kerja Pagi 2 → Kerja Pagi 3 → Kerja Pagi 4 → Libur 1 → Libur 2</small>
`;

function putarMusik() {
  const musikKerja = document.getElementById("musikKerja");
  const musikLibur = document.getElementById("musikLibur");
  const tombol = document.getElementById("tombolMusik");

  const musik = status.includes("Kerja") ? musikKerja : musikLibur;

  if (musik.paused) {
    musik.play().then(() => {
      tombol.innerHTML = "⏸️ Pause Musik";
    }).catch(() => {
      alert("Gagal memutar audio! Pastikan file MP3 berada di folder yang sama.");
    });
  } else {
    musik.pause();
    tombol.innerHTML = "🎵 Putar Musik";
  }
}

function updateWaktu() {
  const sekarang = new Date();
  const jam = sekarang.getHours();
  const menit = sekarang.getMinutes();

  document.getElementById("jam").innerHTML = sekarang.toLocaleTimeString("id-ID");

  let target;
  let keterangan = "";

  // 1. Jika Status Hari Ini LIBUR
  if (status.includes("Libur")) {
    badge.innerHTML = "🔵 LIBUR";
    badge.className = "badge libur";
    document.getElementById("countdown").innerHTML = "";
    document.getElementById("keterangan").innerHTML = "🔵 Hari libur — nikmati waktumu!";
    return;
  }

  // 2. Jam 00:00 - 07:29 (Belum Masuk Kerja)
  if (jam < 7 || (jam === 7 && menit < 30)) {
    badge.innerHTML = "⚫ BELUM MASUK";
    badge.className = "badge off";
    document.getElementById("countdown").innerHTML = "";
    document.getElementById("keterangan").innerHTML = "Menunggu jam masuk kerja (08.00)";
    return;
  }

  // 3. Jam 07:30 - 07:59 (Persiapan Kerja - WARNA KUNING)
  if (jam === 7 && menit >= 30) {
    badge.innerHTML = "🟡 PERSIAPAN";
    badge.className = "badge persiapan";
    target = new Date(sekarang);
    target.setHours(8, 0, 0, 0);
    keterangan = "🟡 Persiapan masuk kerja dalam:";
  }

  // 4. Jam 08:00 - 11:29 (Kerja Pagi)
  else if (jam >= 8 && (jam < 11 || (jam === 11 && menit < 30))) {
    badge.innerHTML = "🟢 MASUK KERJA";
    badge.className = "badge kerja";
    target = new Date(sekarang);
    target.setHours(11, 30, 0, 0);
    keterangan = "Sisa waktu kerja sebelum istirahat:";
  } 

  // 5. Jam 11:30 - 12:59 (Istirahat)
  else if ((jam === 11 && menit >= 30) || jam === 12) {
    badge.innerHTML = "⚪ ISTIRAHAT";
    badge.className = "badge istirahat";
    target = new Date(sekarang);
    target.setHours(13, 0, 0, 0);
    keterangan = "⚪ Sedang istirahat — kembali kerja pukul 13.00 dalam:";
  } 

  // 6. Jam 13:00 - 19:59 (Kerja Siang)
  else if (jam >= 13 && jam < 20) {
    badge.innerHTML = "🟢 MASUK KERJA";
    badge.className = "badge kerja";
    target = new Date(sekarang);
    target.setHours(20, 0, 0, 0);
    keterangan = "Sisa waktu kerja hari ini:";
  }

  // 7. Jam 20:00 - 23:59 (Selesai Shift / OFF)
  else if (jam >= 20) {
    badge.innerHTML = "⚫ OFF";
    badge.className = "badge off";
    document.getElementById("countdown").innerHTML = "";
    document.getElementById("keterangan").innerHTML = "⚫ Selesai jam kerja (OFF)";
    return;
  }

  // Hitung Selisih Hitung Mundur (Countdown)
  const selisih = target - sekarang;
  const jamSisa = Math.floor(selisih / 3600000);
  const menitSisa = Math.floor((selisih % 3600000) / 60000);
  const detikSisa = Math.floor((selisih % 60000) / 1000);

  document.getElementById("countdown").innerHTML =
    `${jamSisa > 0 ? jamSisa + " jam " : ""}${menitSisa} menit ${detikSisa} detik`;
  document.getElementById("keterangan").innerHTML = keterangan;
}

updateWaktu();
setInterval(updateWaktu, 1000);
</script>

</body>
</html>
